name: sigelab
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # ============================================================
  # DEPENDENCIAS DEL PROYECTO
  # ============================================================

  http_parser: ^4.0.2
  crypto: ^3.0.3
  cupertino_icons: ^1.0.8
  http: ^1.6.0

  # Selección y manejo de imágenes
  image_picker: ^1.2.4

  # Cámara y reconocimiento facial
  camera: ^0.12.2
  camera_desktop: ^2.0.0

  # Lectura y generación de códigos QR
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0

# ==============================================================
# DEPENDENCIAS DE DESARROLLO Y PRUEBAS
# ==============================================================

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# ==============================================================
# CONFIGURACIÓN DE FLUTTER
# ==============================================================

flutter:
  uses-material-design: true

# ==============================================================
# CONFIGURACIÓN DEL GENERADOR DE ICONOS
# ==============================================================

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/sigelab_app_icon.png"
  remove_alpha_ios: true

  macos:
    generate: true
    image_path: "assets/icon/sigelab_app_icon.png"