name: sigelab
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  crypto: ^3.0.3
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  image_picker: ^1.2.4
  camera: ^0.12.2
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/sigelab_app_icon.png"
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon/sigelab_app_icon.png"